<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="Sistema di gestione interna per il liquorificio artigianale Stambecco Liqueurs" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Stambecco Liqueurs - Gestione</title>
    <script>
      // Fix per GitHub Pages: quando viene servito 404.html, 
      // reindirizza a index.html mantenendo il path originale nell'URL
      // Questo permette a React Router di gestire il routing correttamente
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Se siamo già su index.html o root, non fare nulla
        if (path === '/index.html' || path === '/') {
          return;
        }
        
        // Se siamo su /index (senza .html), reindirizza a /index.html
        if (path === '/index') {
          window.location.replace('/index.html' + search + hash);
          return;
        }
        
        // Per GitHub Pages: cambia l'URL a /index.html mantenendo il path
        // usando history.replaceState, poi ricarica la pagina
        // Questo permette agli asset di caricarsi correttamente da /
        var newPath = '/index.html';
        history.replaceState(null, '', newPath + search + hash);
        
        // Salva il path originale in sessionStorage per React Router
        sessionStorage.setItem('redirectPath', path);
        
        // Ricarica la pagina per caricare index.html con gli asset corretti
        window.location.reload();
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>JavaScript è necessario per questa applicazione. Abilita JavaScript nel tuo browser.</p>
      <p><a href="/">Vai alla home</a></p>
    </noscript>
  </body>
</html>
